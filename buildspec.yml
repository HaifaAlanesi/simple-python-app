version: 0.2

env:
  secrets-manager:
    DOCKERHUB_USERNAME: "dockerhub/credentials:username"
    DOCKERHUB_PASSWORD: "dockerhub/credentials:password"
    EC2_SSH_KEY: "ec2/ssh-key"

phases:
  pre_build:
    commands:
      - echo Logging in to Docker Hub securely...
      - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t $DOCKERHUB_USERNAME/my-python-app:latest .
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image to Docker Hub...
      - docker push $DOCKERHUB_USERNAME/my-python-app:latest
      
      - echo Preparing SSH key for EC2 deployment...
      - echo "$EC2_SSH_KEY" > ec2_key.pem
      - chmod 600 ec2_key.pem
      
      - echo Deploying to EC2 instance...
      - ssh -o StrictHostKeyChecking=no -i ec2_key.pem ec2-user@52.54.89.75 "docker pull $DOCKERHUB_USERNAME/my-python-app:latest && docker stop python-app-container || true && docker rm python-app-container || true &&  docker run -d -p 80:8080 --name python-app-container $DOCKERHUB_USERNAME/my-python-app:latest "
