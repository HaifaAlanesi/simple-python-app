version: 0.2

env:
  secrets-manager:
    DOCKERHUB_USERNAME: "dockerhub/credentials:username"
    DOCKERHUB_PASSWORD: "dockerhub/credentials:password"

phases:
  pre_build:
    commands:
      - echo Logging in to Docker Hub securely...
      - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t $DOCKERHUB_USERNAME/my-python-app:latest .
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image to Docker Hub...
      - docker push $DOCKERHUB_USERNAME/my-python-app:latest
